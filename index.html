<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スクショポケット</title>
<style>
  :root { --accent:#2B6BFF; --ink:#1A1E2E; --muted:#5B6478; --bg:#F6F7F9; --card:#FFFFFF; --border:#E6E8EF; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; color:var(--ink); background:var(--bg); line-height:1.8; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 22px 72px; }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
  .logo { width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,#2B6BFF,#5B8Cff); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:26px; }
  h1 { font-size:28px; margin:0; font-weight:800; }
  .tagline { color:var(--muted); margin:6px 0 32px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px 24px; margin-bottom:16px; }
  .card h2 { font-size:18px; margin:0 0 8px; }
  .card p { margin:0 0 6px; color:var(--muted); }
  a.btn { display:inline-block; margin-top:10px; color:var(--accent); font-weight:700; text-decoration:none; }
  a.btn:hover { text-decoration:underline; }
  footer { color:var(--muted); font-size:13px; margin-top:32px; text-align:center; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">ス</div>
      <div>
        <h1>スクショポケット</h1>
      </div>
    </div>
    <p class="tagline">探したいスクショをすぐ見つける。スクリーンショット専用の整理・検索・削除アプリ。</p>

    <div class="card">
      <h2>アプリについて</h2>
      <p>スマホに溜まったスクリーンショットを、左右スワイプで直感的に整理。タグで後から素早く再発見できます。画像はすべて端末内で処理され、外部サーバーには送信されません。</p>
    </div>

    <div class="card">
      <h2>サポート</h2>
      <p>使い方・お問い合わせはこちら。</p>
      <a class="btn" href="./support.html">サポートページを開く →</a>
    </div>

    <div class="card">
      <h2>プライバシー</h2>
      <p>収集する情報と取り扱いについて。</p>
      <a class="btn" href="./privacy.html">プライバシーポリシーを開く →</a>
    </div>

    <footer>
      お問い合わせ: <a href="mailto:mitoaks310@gmail.com">mitoaks310@gmail.com</a>
    </footer>
  </div>
</body>
</html>
